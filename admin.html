<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonora — Панель управления</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='80' font-family='Georgia,serif' font-weight='bold' fill='%2334D399' text-anchor='middle'>S</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #121014;
            --surface: #1b181d;
            --surface-2: #242026;
            --border: rgba(242,237,230,0.09);
            --border-strong: rgba(242,237,230,0.25);
            --text: #f2ede6;
            --text-muted: rgba(242,237,230,0.5);
            --accent: #e8a33d;
            --danger: #d9534f;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; }
        .logo-mark { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 32px; color: var(--accent); }
        h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin-top: 10px; }

        /* Вкладки навигации */
        .admin-nav { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
        .nav-tab { padding: 12px 25px; background: var(--surface-2); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.3s; border: 1px solid var(--border); }
        .nav-tab.active { background: rgba(232, 163, 61, 0.1); border-color: var(--accent); color: var(--accent); }
        .nav-tab:hover:not(.active) { background: rgba(255,255,255,0.05); }
        
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .panel-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        form { display: flex; flex-direction: column; gap: 20px; }
        input, select, textarea { width: 100%; padding: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        .row { display: flex; gap: 15px; align-items: center; }
        .row > * { flex: 1; }
        textarea { min-height: 120px; resize: vertical; }
        
        button { font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; transition: 0.2s; border-radius: 8px; border: none; }
        .btn-main { background: var(--accent); color: #121014; padding: 15px; width: 100%; font-size: 15px; }
        .btn-main:hover { background: #f0b45b; }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-cancel { background: var(--surface-2); display: none; width: 100%; padding: 15px; color: var(--text); border: 1px solid var(--border); }
        .btn-cancel:hover { background: rgba(255,255,255,0.05); }
        .btn-del { background: transparent; border: 1px solid var(--danger); color: var(--danger); display: none; width: 100%; padding: 15px; }
        .btn-del:hover { background: var(--danger); color: white; }
        .btn-sec { background: var(--surface-2); color: var(--text); padding: 10px 16px; border: 1px solid var(--border); font-size: 13px; }

        /* Чекбоксы (Переключатели) */
        .switch-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; padding: 12px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); }
        .switch-label input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

        /* Жанры (Теги) */
        .tag-group { border: 1px solid var(--border); padding: 20px; border-radius: 8px; background: var(--surface-2); }
        .tag-group-title { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; font-weight: 600; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .tag-checkbox { display: inline-block; cursor: pointer; }
        .tag-checkbox input { display: none; }
        .tag-checkbox span { display: inline-block; padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; transition: 0.2s; user-select: none; color: var(--text); }
        .tag-checkbox input:checked + span { background: var(--accent); border-color: var(--accent); color: #121014; font-weight: 600; }
        .tag-checkbox:hover span { background: rgba(255,255,255,0.05); }

        /* Треки */
        .track-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; background: var(--surface-2); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .track-row .num { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); width: 24px; text-align: right; }
        .btn-remove-track { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 18px; padding: 0 8px; }

        /* Список релизов */
        .release-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); padding: 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .release-info { display: flex; gap: 15px; align-items: center; }
        .release-actions { display: flex; gap: 10px; }
        .release-actions button { padding: 8px 15px; font-size: 13px; border-radius: 6px; }
        
        /* Drag and Drop Треки лета */
        .drag-item { display: flex; align-items: center; gap: 15px; background: var(--surface-2); padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); cursor: grab; }
        .drag-item:active { cursor: grabbing; border-color: var(--accent); }
        .drag-rank { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: bold; color: var(--accent); width: 30px; text-align: center; }
        .drag-handle { color: var(--text-muted); font-size: 20px; padding: 0 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-mark">Sonora</div>
        <h1>Управление контентом</h1>
    </header>

    <!-- Навигация -->
    <div class="admin-nav">
        <div class="nav-tab active" onclick="switchTab('crud')">✍️ Добавление / Редактирование</div>
        <div class="nav-tab" onclick="switchTab('summer')">☀️ Треки Лета</div>
        <div class="nav-tab" onclick="switchTab('database')">📋 База релизов</div>
    </div>

    <!-- Раздел 1: CRUD (Добавление/Редактирование) -->
    <div id="crud-section" class="section active">
        <form id="release-form">
            <div class="panel">
                <div class="panel-title" id="formTitle">Добавление релиза</div>
                
                <div class="row" style="align-items: stretch;">
                    <input type="text" id="f_artist" required placeholder="Артист (напр. The Midnight)" style="flex: 1;">
                    <input type="text" id="f_title" required placeholder="Название релиза" style="flex: 1;">
                    <button type="button" id="btn-autofetch" onclick="autoFetchAlbumData()" style="flex: 0 0 auto; background: rgba(232,163,61,0.1); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 0 16px;">
                        ✨ Найти (Last.fm)
                    </button>
                </div>

                <div class="row">
                    <select id="f_type">
                        <option value="album">Альбом</option>
                        <option value="single">Сингл</option>
                        <option value="ep">EP (Мини-альбом)</option>
                    </select>
                    <input type="date" id="f_date" title="Дата выхода">
                </div>

                <!-- БЛОК ВЫБОРА ЖАНРОВ -->
                <div class="tag-group">
                    <div class="tag-group-title">Жанры (выберите один или несколько)</div>
                    <div class="tags-container" id="genresContainer">
                        <!-- Жанры генерируются через JS -->
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newGenreInput" placeholder="Свой жанр (если нет в списке)" style="padding: 10px; font-size: 13px;">
                        <button type="button" class="btn-sec" onclick="addNewGenre()">Добавить</button>
                    </div>
                </div>

                <div class="row">
                    <input type="url" id="f_cover_url" placeholder="Прямая ссылка на обложку (URL)">
                    <select id="f_theme" title="Цветовая тема">
                        <option value="teal">Teal (Изумрудный)</option>
                        <option value="coral">Coral (Коралловый)</option>
                        <option value="pink">Pink (Розовый)</option>
                        <option value="amber">Amber (Янтарный)</option>
                        <option value="green">Green (Зеленый)</option>
                        <option value="plum">Plum (Сливовый)</option>
                    </select>
                </div>

                <div class="row">
                    <input type="number" id="f_rating" step="0.1" min="0" max="10" placeholder="Оценка (0 - 10)">
                </div>

                <label class="switch-label">
                    <input type="checkbox" id="f_is_new" checked>
                    Показывать в разделе «Последние новинки»
                </label>

                <label class="switch-label">
                    <input type="checkbox" id="f_is_summer">
                    Добавить в подборку «Треки лета»
                </label>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; margin-top: 10px;">
                    <label style="font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Текст рецензии</label>
                    <button type="button" onclick="insertImageTag('f_review')" style="background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer;">🖼️ Вставить картинку</button>
                </div>
                <textarea id="f_review" placeholder="Напишите пару слов об альбоме..."></textarea>
            </div>

            <div class="panel">
                <div class="panel-title">Треклист</div>
                <div id="tracks-container">
                    <!-- Сюда добавляются треки -->
                </div>
                <button type="button" class="btn-sec" onclick="addTrackRow()" style="width: 100%; margin-top: 10px;">+ Добавить трек</button>
            </div>

            <div class="row">
                <button type="button" id="btnCancel" class="btn-cancel" onclick="cancelEdit()">Отменить</button>
                <button type="button" id="btnDelete" class="btn-del" onclick="deleteCurrentEditing()">🗑️ Удалить</button>
                <button type="submit" id="btnSubmit" class="btn-main">Сохранить релиз</button>
            </div>
            <div id="status-msg" style="text-align: center; font-weight: 500; font-size: 14px; margin-top: 10px;"></div>
        </form>
    </div>

    <!-- Раздел 2: Drag and Drop (Треки Лета) -->
    <div id="summer-section" class="section">
        <div class="panel">
            <div class="panel-title">Редактор "Треки Лета"</div>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px; text-align: center;">
                Перетаскивайте релизы для изменения их позиции в топе. Не забудьте сохранить!
            </p>
            
            <div id="summerDragContainer">
                <!-- Заполняется через JS -->
            </div>
            
            <button type="button" class="btn-main" style="margin-top: 20px;" onclick="saveSummerOrder()" id="btnSaveSummer">💾 Сохранить новый порядок</button>
        </div>
    </div>

    <!-- Раздел 3: База релизов -->
    <div id="database-section" class="section">
        <div class="panel">
            <div class="panel-title">Все релизы в базе</div>
            <div id="releases-list">
                <p style="color: var(--text-muted); text-align: center;">Загрузка списка...</p>
            </div>
        </div>
    </div>

</div>

<!-- Библиотеки -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script>
    // Инициализация Supabase
    const SUPABASE_URL = 'https://xlavseqcmfiqbiheajea.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsYXZzZXFjbWZpcWJpaGVhamVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTc2ODgsImV4cCI6MjEwMDQ3MzY4OH0.Biwof0qcafViagViPddujVId4Q6nVguGCkoLJ0urdeE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let editingReleaseId = null;
    let trackCount = 0;
    const tracksContainer = document.getElementById('tracks-container');
    let currentReleases = [];

    // --- ЖАНРЫ (МНОЖЕСТВЕННЫЙ ВЫБОР) ---
    const MUSIC_GENRES = ['Synthwave', 'Retrowave', 'Electronic', 'Pop', 'Indie Pop', 'Rock', 'Alternative', 'Hip-Hop', 'R&B', 'Ambient', 'House', 'Techno', 'Metal', 'Jazz', 'Classical', 'Soundtrack'];

    function renderGenres() {
        const container = document.getElementById('genresContainer');
        container.innerHTML = MUSIC_GENRES.map(g => createGenreHTML(g)).join('');
    }

    function createGenreHTML(name, isChecked = false) {
        return `
            <label class="tag-checkbox">
                <input type="checkbox" class="cb-genre" value="${name}" ${isChecked ? 'checked' : ''}>
                <span>${name}</span>
            </label>
        `;
    }

    function addNewGenre(customName = null) {
        const input = document.getElementById('newGenreInput');
        const val = customName || input.value.trim();
        if (!val) return;
        
        // Проверяем, есть ли уже такой жанр (игнорируя регистр)
        const existing = Array.from(document.querySelectorAll('.cb-genre'));
        const found = existing.find(cb => cb.value.toLowerCase() === val.toLowerCase());
        
        if (!found) {
            // Создаем новый чекбокс и сразу отмечаем его
            document.getElementById('genresContainer').insertAdjacentHTML('beforeend', createGenreHTML(val, true));
        } else {
            // Если такой уже есть, просто ставим галочку
            found.checked = true;
        }
        
        if (!customName) input.value = '';
    }

    // Добавляем жанр по нажатию Enter в поле ввода
    document.getElementById('newGenreInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addNewGenre();
        }
    });


    // --- НАВИГАЦИЯ ---
    function switchTab(tabId) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        document.querySelector(`.nav-tab[onclick*="${tabId}"]`).classList.add('active');
        document.getElementById(tabId + '-section').classList.add('active');

        if(tabId === 'summer') renderSummerSort();
    }

    // --- БАЗА И СПИСОК РЕЛИЗОВ ---
    async function loadReleases() {
        const { data, error } = await supabaseClient
            .from('release_cards')
            .select('*')
            .order('created_at', { ascending: false });

        const list = document.getElementById('releases-list');
        
        if (error) {
            list.innerHTML = `<p style="color: var(--danger);">Ошибка: ${error.message}</p>`;
            return;
        }

        currentReleases = data || [];
        
        if (currentReleases.length === 0) {
            list.innerHTML = '<p style="text-align:center;">Релизов пока нет.</p>';
            return;
        }

        list.innerHTML = currentReleases.map(release => {
            const type = (release.tracks && release.tracks.length <= 1) ? 'Сингл' : 'Альбом';
            const color = type === 'Сингл' ? 'var(--accent)' : 'var(--text-muted)';
            
            return `
            <div class="release-item">
                <div class="release-info">
                    <div>
                        <strong style="color: var(--accent);">${release.artist || 'Артист'}</strong> — ${release.title}
                        <span style="margin-left: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: ${color};">${type}</span>
                    </div>
                </div>
                <div class="release-actions">
                    <button type="button" onclick="startEdit('${release.release_id}')" class="btn-sec">Изменить</button>
                    <button type="button" onclick="deleteFromList('${release.release_id}')" class="btn-sec" style="color: var(--danger); border-color: rgba(217, 83, 79, 0.3);">Удалить</button>
                </div>
            </div>`;
        }).join('');
    }

    // --- CRUD ЛОГИКА ---
    function addTrackRow(trackName = '') {
        trackCount++;
        const div = document.createElement('div');
        div.className = 'track-row';
        div.innerHTML = `
            <span class="num">${trackCount}</span>
            <input type="text" class="t-title" placeholder="Название трека" value="${trackName.replace(/"/g, '&quot;')}" required style="flex: 2; padding: 8px;">
            <button type="button" class="btn-remove-track" title="Удалить трек" onclick="this.parentElement.remove(); updateTrackNumbers();">&times;</button>
        `;
        tracksContainer.appendChild(div);
    }

    function updateTrackNumbers() {
        const rows = tracksContainer.querySelectorAll('.track-row');
        trackCount = 0;
        rows.forEach(row => {
            trackCount++;
            row.querySelector('.num').textContent = trackCount;
        });
    }

    function insertImageTag(fieldId) {
        const textarea = document.getElementById(fieldId);
        const url = prompt('Введите прямую ссылку на картинку:');
        if (!url) return;
        const tag = `[img]${url.trim()}[/img]`;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        textarea.value = text.substring(0, start) + tag + text.substring(end);
        textarea.focus();
    }

    async function startEdit(id) {
        const { data: release } = await supabaseClient.from('releases').select('*, artists(name)').eq('id', id).single();
        const { data: tracks } = await supabaseClient.from('tracks').select('*').eq('release_id', id).order('number', { ascending: true });

        if (!release) return;

        document.getElementById('f_title').value = release.title || '';
        document.getElementById('f_artist').value = release.artists?.name || '';
        document.getElementById('f_cover_url').value = release.cover_url || ''; 
        document.getElementById('f_date').value = release.release_date || '';
        document.getElementById('f_type').value = release.release_type || 'album';
        document.getElementById('f_theme').value = release.cover_theme || 'teal';
        document.getElementById('f_rating').value = release.rating || '';
        document.getElementById('f_review').value = release.review || '';
        document.getElementById('f_is_new').checked = release.is_new;
        document.getElementById('f_is_summer').checked = release.is_summer_pick;

        // Восстановление жанров
        document.querySelectorAll('.cb-genre').forEach(cb => cb.checked = false);
        if (release.genre) {
            const genresArr = release.genre.split(',').map(s => s.trim());
            genresArr.forEach(g => { if (g) addNewGenre(g); });
        }

        tracksContainer.innerHTML = '';
        trackCount = 0;
        if (tracks && tracks.length > 0) {
            tracks.forEach(t => addTrackRow(t.title));
        } else {
            addTrackRow();
        }

        editingReleaseId = id;
        document.getElementById('formTitle').innerText = 'Редактирование релиза';
        
        const submitBtn = document.getElementById('btnSubmit');
        submitBtn.textContent = '💾 Сохранить изменения';
        submitBtn.style.backgroundColor = '#4caf50';
        
        document.getElementById('btnCancel').style.display = 'block';
        document.getElementById('btnDelete').style.display = 'block';

        switchTab('crud');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingReleaseId = null;
        document.getElementById('release-form').reset();
        tracksContainer.innerHTML = '';
        trackCount = 0;
        addTrackRow();

        document.querySelectorAll('.cb-genre').forEach(cb => cb.checked = false);

        document.getElementById('formTitle').innerText = 'Добавление релиза';
        const submitBtn = document.getElementById('btnSubmit');
        submitBtn.textContent = 'Сохранить релиз';
        submitBtn.style.backgroundColor = '';
        
        document.getElementById('btnCancel').style.display = 'none';
        document.getElementById('btnDelete').style.display = 'none';
        document.getElementById('status-msg').textContent = '';
    }

    async function deleteFromList(id) {
        if (!confirm('Вы уверены, что хотите удалить этот релиз? Треки тоже будут удалены.')) return;
        await supabaseClient.from('tracks').delete().eq('release_id', id);
        await supabaseClient.from('releases').delete().eq('id', id);
        loadReleases();
    }

    async function deleteCurrentEditing() {
        if (editingReleaseId) {
            await deleteFromList(editingReleaseId);
            cancelEdit();
            switchTab('database');
        }
    }

    // Сохранение формы
    document.getElementById('release-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const msg = document.getElementById('status-msg');
        
        btn.textContent = 'Сохранение...'; btn.disabled = true; msg.textContent = '';

        // Сбор треков
        const tracks = [];
        document.querySelectorAll('.track-row').forEach((row, index) => {
            const title = row.querySelector('.t-title').value.trim();
            if (title) tracks.push({ number: index + 1, title: title, duration: null });
        });

        // Сбор выбранных жанров
        const selectedGenres = Array.from(document.querySelectorAll('.cb-genre:checked')).map(cb => cb.value).join(', ');

        if (!selectedGenres) {
            msg.style.color = 'var(--danger)';
            msg.textContent = '❌ Выберите хотя бы один жанр!';
            btn.textContent = editingReleaseId ? '💾 Сохранить изменения' : 'Сохранить релиз';
            btn.disabled = false;
            return;
        }

        if (tracks.length === 0) {
            msg.style.color = 'var(--danger)';
            msg.textContent = '❌ Добавьте хотя бы один трек!';
            btn.textContent = editingReleaseId ? '💾 Сохранить изменения' : 'Сохранить релиз';
            btn.disabled = false;
            return;
        }

        try {
            if (editingReleaseId) {
                // ОБНОВЛЕНИЕ
                await supabaseClient.from('releases').update({
                    title: document.getElementById('f_title').value.trim(),
                    genre: selectedGenres,
                    release_type: document.getElementById('f_type').value,
                    cover_url: document.getElementById('f_cover_url').value.trim() || null,
                    cover_theme: document.getElementById('f_theme').value,
                    rating: parseFloat(document.getElementById('f_rating').value) || null,
                    review: document.getElementById('f_review').value.trim() || null,
                    is_new: document.getElementById('f_is_new').checked,
                    release_date: document.getElementById('f_date').value || null,
                    is_summer_pick: document.getElementById('f_is_summer').checked
                }).eq('id', editingReleaseId);

                await supabaseClient.from('tracks').delete().eq('release_id', editingReleaseId);
                const newTracksToInsert = tracks.map(t => ({ release_id: editingReleaseId, title: t.title, number: t.number }));
                await supabaseClient.from('tracks').insert(newTracksToInsert);

                alert('✅ Релиз успешно обновлен!');
                cancelEdit();
                switchTab('database');
            } else {
                // ДОБАВЛЕНИЕ (через RPC)
                const payload = {
                    p_artist_name: document.getElementById('f_artist').value.trim(),
                    p_title: document.getElementById('f_title').value.trim(),
                    p_genre: selectedGenres,
                    p_release_type: document.getElementById('f_type').value,
                    p_cover_url: document.getElementById('f_cover_url').value.trim() || null,
                    p_cover_theme: document.getElementById('f_theme').value,
                    p_rating: parseFloat(document.getElementById('f_rating').value) || null,
                    p_review: document.getElementById('f_review').value.trim() || null,
                    p_is_new: document.getElementById('f_is_new').checked,
                    p_release_date: document.getElementById('f_date').value || null,
                    p_is_summer_pick: document.getElementById('f_is_summer').checked,
                    p_summer_pick_rank: 999, // Дефолт, сортируется во вкладке "Треки лета"
                    p_summer_pick_label: null,
                    p_tracks: tracks
                };

                const { error } = await supabaseClient.rpc('add_new_release', payload);
                if (error) throw error;
                
                alert('✅ Релиз успешно добавлен!');
                cancelEdit();
            }
            loadReleases();
        } catch (err) {
            console.error(err);
            msg.style.color = 'var(--danger)';
            msg.textContent = '❌ Ошибка: ' + err.message;
        } finally {
            if(!editingReleaseId) {
                btn.textContent = 'Сохранить релиз'; 
                btn.disabled = false;
            }
        }
    });

    // --- SORTABLE JS (Треки Лета) ---
    let sortableInstance = null;
    
    async function renderSummerSort() {
        const container = document.getElementById('summerDragContainer');
        
        const { data, error } = await supabaseClient.from('releases').select('id, title, summer_pick_rank, artists(name)').eq('is_summer_pick', true).order('summer_pick_rank', { ascending: true });
        
        if (error || !data || data.length === 0) {
            container.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">В подборке пока нет релизов. Включите галочку "Треки лета" при добавлении.</div>';
            return;
        }

        container.innerHTML = data.map((item, index) => `
            <div class="drag-item" data-id="${item.id}">
                <div class="drag-handle">☰</div>
                <div class="drag-rank">${index + 1}</div>
                <div class="drag-title">
                    <strong style="color:var(--text)">${item.artists?.name || ''}</strong> — <span style="color:var(--text-muted)">${item.title}</span>
                </div>
            </div>
        `).join('');

        if (sortableInstance) sortableInstance.destroy();
        sortableInstance = new Sortable(container, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd: function () {
                const items = document.querySelectorAll('#summerDragContainer .drag-item');
                items.forEach((item, i) => {
                    item.querySelector('.drag-rank').innerText = i + 1;
                });
            }
        });
    }

    async function saveSummerOrder() {
        const btn = document.getElementById('btnSaveSummer');
        btn.innerText = '⏳ Сохранение...'; btn.disabled = true;
        const items = document.querySelectorAll('#summerDragContainer .drag-item');
        const updates = [];

        items.forEach((item, index) => {
            updates.push(supabaseClient.from('releases').update({ summer_pick_rank: index + 1 }).eq('id', item.getAttribute('data-id')));
        });

        try {
            await Promise.all(updates);
            alert("✅ Порядок успешно сохранен!");
        } catch (error) {
            alert("Ошибка сохранения: " + error.message);
        } finally {
            btn.innerText = '💾 Сохранить новый порядок'; btn.disabled = false;
        }
    }


    // --- API LAST.FM (АВТОЗАПОЛНЕНИЕ) ---
    async function autoFetchAlbumData() {
        const artist = document.getElementById('f_artist').value.trim();
        const title = document.getElementById('f_title').value.trim();

        if (!artist || !title) return alert('Укажите Артиста и Название релиза!');
        
        const API_KEY = '3b161b314c4488462ce9102305148fe5';
        const btn = document.getElementById('btn-autofetch');
        const originalText = btn.textContent;
        btn.textContent = '⏳ Ищу...'; btn.disabled = true;

        try {
            const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${API_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(title)}&autocorrect=1&format=json`;
            const res = await fetch(url);
            const data = await res.json();

            if (data.error || !data.album) return alert('Last.fm не смог найти этот релиз 😔');

            const album = data.album;
            if (album.image && album.image.length > 0) {
                const largest = album.image[album.image.length - 1]['#text'];
                if (largest) document.getElementById('f_cover_url').value = largest;
            }

            // Автодобавление и выделение жанра
            if (album.tags && album.tags.tag) {
                const tags = Array.isArray(album.tags.tag) ? album.tags.tag : [album.tags.tag];
                if (tags.length > 0 && tags[0].name) {
                    let tagName = tags[0].name;
                    tagName = tagName.charAt(0).toUpperCase() + tagName.slice(1);
                    addNewGenre(tagName);
                }
            }

            tracksContainer.innerHTML = ''; trackCount = 0;
            if (album.tracks && album.tracks.track) {
                const tracks = Array.isArray(album.tracks.track) ? album.tracks.track : [album.tracks.track];
                if (tracks.length > 0) tracks.forEach(t => addTrackRow(t.name));
                else addTrackRow(); 
            } else { addTrackRow(); }

        } catch (error) {
            alert('Ошибка сети API: ' + error.message);
        } finally {
            btn.textContent = originalText; btn.disabled = false;
        }
    }

    // Инициализация при загрузке страницы
    renderGenres();
    addTrackRow();
    loadReleases();
</script>
