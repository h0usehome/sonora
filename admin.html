<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonora — Админ-панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121014;
    --surface-1: #1b181d;
    --surface-2: #242026;
    --border: rgba(242,237,230,0.09);
    --border-strong: rgba(242,237,230,0.25);
    --text: #f2ede6;
    --text-muted: rgba(242,237,230,0.5);
    --accent: #e8a33d;
    --danger: #d9534f;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 40px 20px; }
  .container { max-width: 800px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 40px; }
  .logo-mark { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 32px; color: var(--accent); }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin-top: 10px; }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 24px; }
  .panel-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

  .row { display: flex; gap: 20px; margin-bottom: 20px; }
  .row > * { flex: 1; }
  
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  
  input[type="text"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
    width: 100%; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--border); 
    border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; transition: 0.2s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 120px; resize: vertical; }

  /* Переключатели (Чекбоксы) */
  .switch-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; padding: 12px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); }
  .switch-label input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  /* Блок треков */
  .track-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; background: var(--surface-2); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
  .track-row .num { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); width: 24px; text-align: right; }
  .btn-remove-track { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 18px; padding: 0 8px; }

  button { font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; transition: 0.2s; border-radius: 8px; border: none; }
  .btn-main { background: var(--accent); color: #121014; padding: 16px; width: 100%; font-size: 16px; margin-top: 20px; }
  .btn-main:hover { background: #f0b45b; }
  .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .btn-sec { background: var(--surface-2); color: var(--text); padding: 10px 16px; border: 1px solid var(--border); font-size: 13px; }
  .btn-sec:hover { background: rgba(255,255,255,0.05); border-color: var(--border-strong); }

  #status-msg { margin-top: 20px; text-align: center; font-weight: 500; font-size: 14px; }
  .success { color: #a3e681; }
  .error { color: #e68181; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-mark">Sonora</div>
    <h1>Добавление релиза</h1>
  </header>

  <form id="release-form">
    <!-- Блок 1: Основная информация -->
    <div class="panel">
      <div class="panel-title">Основная информация</div>
      <div class="row">
        <div class="form-group">
          <label>Артист *</label>
          <input type="text" id="f_artist" required placeholder="Например: The Midnight">
        </div>
        <div class="form-group">
          <label>Название релиза *</label>
          <input type="text" id="f_title" required placeholder="Например: Endless Summer">
        </div>
      </div>
      <!-- Новая кнопка автопоиска -->
      <button type="button" class="btn-sec" id="btn-autofetch" onclick="autoFetchAlbumData()" style="margin-bottom: 20px; width: 100%; background: rgba(232,163,61,0.1); color: var(--accent); border-color: var(--accent);">
        ✨ Найти обложку, треклист и жанр автоматически
      </button>
      <div class="row">
        <div class="form-group">
          <label>Жанр *</label>
          <input type="text" id="f_genre" required placeholder="Например: Synthwave">
        </div>
        <div class="form-group">
          <label>Дата выхода</label>
          <input type="date" id="f_date">
        </div>
      </div>
      <label class="switch-label">
        <input type="checkbox" id="f_is_new" checked>
        Показывать в разделе «Последние новинки»
      </label>
    </div>

    <!-- Блок 2: Оформление -->
    <div class="panel">
      <div class="panel-title">Обложка и тема</div>
      <div class="form-group">
        <label>Прямая ссылка на обложку (URL)</label>
        <input type="url" id="f_cover_url" placeholder="https://example.com/cover.jpg">
      </div>
      <div class="form-group">
        <label>Цветовая тема (если нет обложки)</label>
        <select id="f_theme">
          <option value="teal">Teal (Изумрудный)</option>
          <option value="coral">Coral (Коралловый)</option>
          <option value="pink">Pink (Розовый)</option>
          <option value="amber">Amber (Янтарный)</option>
          <option value="green">Green (Зеленый)</option>
          <option value="plum">Plum (Сливовый)</option>
        </select>
      </div>
    </div>

    <!-- Блок 3: Рецензия -->
    <div class="panel">
      <div class="panel-title">Оценка и Рецензия</div>
      <div class="form-group">
        <label>Оценка (0 - 10)</label>
        <input type="number" id="f_rating" step="0.1" min="0" max="10" placeholder="Например: 8.5">
      </div>
      <div class="form-group">
        <label>Текст рецензии</label>
        <textarea id="f_review" placeholder="Напишите пару слов об альбоме..."></textarea>
      </div>
    </div>

    <!-- Блок 4: Треки лета -->
    <div class="panel">
      <div class="panel-title">Подборка "Треки лета"</div>
      <label class="switch-label" style="margin-bottom: 16px;">
        <input type="checkbox" id="f_is_summer" onchange="document.getElementById('summer-settings').style.display = this.checked ? 'flex' : 'none'">
        Добавить в подборку лета
      </label>
      <div class="row" id="summer-settings" style="display: none;">
        <div class="form-group">
          <label>Порядковый номер в топе</label>
          <input type="number" id="f_summer_rank" placeholder="1">
        </div>
        <div class="form-group">
          <label>Короткая подпись (опционально)</label>
          <input type="text" id="f_summer_label" placeholder="Главный хит июля">
        </div>
      </div>
    </div>

    <!-- Блок 5: Треклист -->
    <div class="panel">
      <div class="panel-title">Треклист</div>
      <div id="tracks-container">
        <!-- Сюда добавляются треки -->
      </div>
      <button type="button" class="btn-sec" onclick="addTrackRow()">+ Добавить трек</button>
    </div>

    <button type="submit" id="btn-submit" class="btn-main">Сохранить релиз в базу</button>
    <div id="status-msg"></div>
  </form>
  <!-- Секция управления релизами -->
<hr style="margin: 50px 0; border: 1px solid rgba(255,255,255,0.1);">
<div class="releases-manager">
  <h2 style="margin-bottom: 20px;">Существующие релизы</h2>
  <div id="releases-list" style="display: flex; flex-direction: column; gap: 10px;">
    <!-- Список релизов загрузится сюда через JS -->
    <p style="color: #888;">Загрузка списка...</p>
  </div>
</div>
</div>

  <!-- Библиотека Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  // ==========================================
  let editingReleaseId = null; // Если null — создаем новый. Если есть ID — обновляем.  
  // ==========================================
  const SUPABASE_URL = 'https://xlavseqcmfiqbiheajea.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsYXZzZXFjbWZpcWJpaGVhamVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTc2ODgsImV4cCI6MjEwMDQ3MzY4OH0.Biwof0qcafViagViPddujVId4Q6nVguGCkoLJ0urdeE';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Управление треками
  const tracksContainer = document.getElementById('tracks-container');
  let trackCount = 0;

  function addTrackRow(trackName = '') {
    trackCount++;
    const div = document.createElement('div');
    div.className = 'track-row';
    div.innerHTML = `
      <span class="num">${trackCount}</span>
      <input type="text" class="t-title" placeholder="Название трека" value="${trackName.replace(/"/g, '&quot;')}" required style="flex: 2;">
      <button type="button" class="btn-remove-track" title="Удалить трек" onclick="this.parentElement.remove(); updateTrackNumbers();">&times;</button>
    `;
    tracksContainer.appendChild(div);
  }

  function updateTrackNumbers() {
    const rows = tracksContainer.querySelectorAll('.track-row');
    trackCount = 0;
    rows.forEach(row => {
      trackCount++;
      row.querySelector('.num').textContent = trackCount;
    });
  }
  
// Функция автоматического поиска через Last.fm API
  async function autoFetchAlbumData() {
    const artist = document.getElementById('f_artist').value.trim();
    const title = document.getElementById('f_title').value.trim();

    if (!artist || !title) {
      alert('Для поиска в Last.fm обязательно нужно указать и Артиста, и Название релиза!');
      return;
    }

    // ВСТАВЬТЕ ВАШ КЛЮЧ LAST.FM СЮДА
    const API_KEY = '3b161b314c4488462ce9102305148fe5'; 
    
    if (API_KEY === 'ВАШ_API_КЛЮЧ_ИЗ_ШАГА_1') {
      alert('Сначала добавьте свой API-ключ Last.fm в код скрипта (переменная API_KEY)!');
      return;
    }

    const btn = document.getElementById('btn-autofetch');
    const originalText = btn.textContent;
    btn.textContent = '⏳ Ищу на Last.fm...';
    btn.disabled = true;

    try {
      const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${API_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(title)}&autocorrect=1&format=json`;

      const res = await fetch(url);
      const data = await res.json();

      if (data.error || !data.album) {
        alert('Last.fm не смог найти этот релиз 😔\n\nПроверьте правильность написания или заполните данные вручную.');
        return;
      }

      const album = data.album;

      // 1. Обложка
      if (album.image && album.image.length > 0) {
        const largestImage = album.image[album.image.length - 1]['#text'];
        if (largestImage) {
           document.getElementById('f_cover_url').value = largestImage;
        }
      }

     // 2. Жанр (безопасное извлечение)
      const genreInput = document.getElementById('f_genre');
      if (!genreInput.value && album.tags && album.tags.tag) {
        // Last.fm может вернуть массив тегов или один объект
        const tags = Array.isArray(album.tags.tag) ? album.tags.tag : [album.tags.tag];
        
        if (tags.length > 0 && tags[0].name) {
          const tagName = tags[0].name;
          genreInput.value = tagName.charAt(0).toUpperCase() + tagName.slice(1);
        }
      }

      // 3. Дата релиза (с проверкой на ошибки)
      const dateInput = document.getElementById('f_date');
      if (!dateInput.value) {
        if (album.wiki && album.wiki.published) {
          try {
            // Очищаем строку от лишних пробелов и отрезаем время
            const dateString = album.wiki.published.split(',')[0].trim(); 
            const dateObj = new Date(dateString);
            
            // getTime() надежнее проверяет, валидна ли дата
            if (!isNaN(dateObj.getTime())) {
              const yyyy = dateObj.getFullYear();
              const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
              const dd = String(dateObj.getDate()).padStart(2, '0');
              dateInput.value = `${yyyy}-${mm}-${dd}`;
            } else {
              console.warn('JS не смог расшифровать дату Last.fm:', album.wiki.published);
            }
          } catch (e) {
            console.error('Ошибка при обработке даты:', e);
          }
        } else {
          console.log('У этого альбома в Last.fm нет информации о дате выхода (отсутствует wiki).');
        }
      }
      // 4. Треклист
      tracksContainer.innerHTML = '';
      trackCount = 0;

      if (album.tracks && album.tracks.track) {
        const tracks = Array.isArray(album.tracks.track) ? album.tracks.track : [album.tracks.track];
        
        if (tracks.length > 0) {
          tracks.forEach(t => addTrackRow(t.name));
        } else {
          addTrackRow(); 
        }
      } else {
        addTrackRow(); 
      }

    } catch (error) {
      console.error(error);
      alert('Ошибка сети или API: ' + error.message);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }
  
  // 1. Загрузка списка релизов из базы
async function loadReleases() {
  const list = document.getElementById('releases-list');
  
  // Тянем данные из вьюхи release_cards (так как в ней уже склеены Артист и Название)
  const { data, error } = await supabaseClient
    .from('release_cards')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    list.innerHTML = `<p style="color: red;">Ошибка загрузки: ${error.message}</p>`;
    return;
  }

  list.innerHTML = '';
  if (data.length === 0) {
    list.innerHTML = '<p>Релизов пока нет.</p>';
    return;
  }

  data.forEach(release => {
    const div = document.createElement('div');
    div.style = 'display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);';
    div.innerHTML = `
      <div>
        <strong style="color: var(--accent);">${release.artist || 'Артист'}</strong> — ${release.title}
      </div>
      <div style="display: flex; gap: 10px;">
        <button type="button" onclick="startEdit('${release.release_id}')" style="padding: 5px 15px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer;">Изменить</button>
        <button type="button" onclick="deleteRelease('${release.release_id}')" style="padding: 5px 15px; background: #e53935; color: white; border: none; border-radius: 4px; cursor: pointer;">Удалить</button>
      </div>
    `;
    list.appendChild(div);
  });
}

// 2. Удаление релиза
async function deleteRelease(id) {
  if (!confirm('Вы уверены, что хотите удалить этот релиз? Треки тоже будут удалены.')) return;

  // Сначала удаляем треки, чтобы избежать конфликта внешних ключей (foreign keys)
  await supabaseClient.from('tracks').delete().eq('release_id', id);
  
  // Затем удаляем сам релиз
  const { error } = await supabaseClient.from('releases').delete().eq('id', id);

  if (error) {
    alert('Ошибка при удалении: ' + error.message);
  } else {
    loadReleases(); // Обновляем список на экране
  }
}

// 3. Подготовка формы к редактированию
async function startEdit(id) {
  // Получаем сам релиз (при необходимости замените 'artists(name)' на вашу логику связи с артистом)
  const { data: release } = await supabaseClient
    .from('releases')
    .select('*, artists(name)')
    .eq('id', id)
    .single();

  // Получаем треклист
  const { data: tracks } = await supabaseClient
    .from('tracks')
    .select('*')
    .eq('release_id', id)
    .order('track_number', { ascending: true }); // или просто 'number'

  if (!release) return;

  // Заполняем форму данными из базы
  document.getElementById('f_title').value = release.title || '';
  document.getElementById('f_artist').value = release.artists?.name || ''; // Берем имя связанного артиста
  document.getElementById('f_cover_url').value = release.cover_url || ''; 
  document.getElementById('f_genre').value = release.genre || '';
  document.getElementById('f_date').value = release.release_date || '';

  // Очищаем текущие треки в форме и заполняем старыми
  tracksContainer.innerHTML = '';
  trackCount = 0;
  if (tracks && tracks.length > 0) {
    tracks.forEach(t => addTrackRow(t.title));
  } else {
    addTrackRow();
  }

  // Переводим интерфейс в режим редактирования
  editingReleaseId = id;
  const submitBtn = document.querySelector('form button[type="submit"]');
  submitBtn.textContent = '💾 Сохранить изменения';
  submitBtn.style.backgroundColor = '#4caf50';

  window.scrollTo({ top: 0, behavior: 'smooth' }); // Плавно скроллим наверх к форме
}

// Вызываем загрузку списка сразу при открытии страницы
loadReleases();
  // Отправка формы
    // Отправка формы
  document.getElementById('release-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const msg = document.getElementById('status-msg');
    
    btn.textContent = 'Сохранение...';
    btn.disabled = true;
    msg.className = '';
    msg.textContent = '';

    // Собираем треки (без тайминга)
    const tracks = [];
    document.querySelectorAll('.track-row').forEach((row, index) => {
      const title = row.querySelector('.t-title').value.trim();
      if (title) {
        tracks.push({
          number: index + 1,
          title: title,
          duration: null // Отправляем null, раз тайминга пока нет
        });
      }
    });

    if (tracks.length === 0) {
      msg.className = 'error';
      msg.textContent = '❌ Добавьте хотя бы один трек!';
      btn.textContent = 'Сохранить релиз в базу';
      btn.disabled = false;
      return;
    }

    try {
      if (editingReleaseId) {
        // --- РЕЖИМ ОБНОВЛЕНИЯ (UPDATE) ---
        
        const { error: updateError } = await supabaseClient
          .from('releases')
          .update({
            title: document.getElementById('f_title').value.trim(),
            genre: document.getElementById('f_genre').value.trim(),
            cover_url: document.getElementById('f_cover_url').value.trim() || null,
            cover_theme: document.getElementById('f_theme').value,
            rating: parseFloat(document.getElementById('f_rating').value) || null,
            review: document.getElementById('f_review').value.trim() || null,
            is_new: document.getElementById('f_is_new').checked,
            release_date: document.getElementById('f_date').value || null,
            is_summer_pick: document.getElementById('f_is_summer').checked,
            summer_pick_rank: parseInt(document.getElementById('f_summer_rank').value) || null,
            summer_pick_label: document.getElementById('f_summer_label').value.trim() || null
          })
          .eq('id', editingReleaseId);

        if (updateError) throw updateError;

        // Обновляем треки: удаляем старые, пишем новые
        await supabaseClient.from('tracks').delete().eq('release_id', editingReleaseId);
        
        const newTracksToInsert = tracks.map(t => ({
          release_id: editingReleaseId,
          title: t.title,
          track_number: t.number
        }));
        
        const { error: tracksError } = await supabaseClient.from('tracks').insert(newTracksToInsert);
        if (tracksError) throw tracksError;

        msg.className = 'success';
        msg.textContent = '✅ Релиз успешно обновлен!';

        // Сбрасываем состояние редактирования
        editingReleaseId = null;
        btn.style.backgroundColor = '';

      } else {
        // --- РЕЖИМ СОЗДАНИЯ (INSERT) ---
        
        const payload = {
          p_artist_name: document.getElementById('f_artist').value.trim(),
          p_title: document.getElementById('f_title').value.trim(),
          p_genre: document.getElementById('f_genre').value.trim(),
          p_cover_url: document.getElementById('f_cover_url').value.trim() || null,
          p_cover_theme: document.getElementById('f_theme').value,
          p_rating: parseFloat(document.getElementById('f_rating').value) || null,
          p_review: document.getElementById('f_review').value.trim() || null,
          p_is_new: document.getElementById('f_is_new').checked,
          p_release_date: document.getElementById('f_date').value || null,
          p_is_summer_pick: document.getElementById('f_is_summer').checked,
          p_summer_pick_rank: parseInt(document.getElementById('f_summer_rank').value) || null,
          p_summer_pick_label: document.getElementById('f_summer_label').value.trim() || null,
          p_tracks: tracks
        };

        const { error } = await supabaseClient.rpc('add_new_release', payload);
        if (error) throw error;

        msg.className = 'success';
        msg.textContent = '✅ Релиз успешно добавлен в базу!';
      }

      // Очищаем форму и обновляем список релизов
      document.getElementById('release-form').reset();
      tracksContainer.innerHTML = '';
      trackCount = 0;
      addTrackRow(); // Добавляем одну пустую строку трека для удобства
      document.getElementById('summer-settings').style.display = 'none';
      
      loadReleases(); // Обновляем список внизу
      window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (err) {
      console.error(err);
      msg.className = 'error';
      msg.textContent = '❌ Ошибка: ' + err.message;
    } finally {
      btn.textContent = 'Сохранить релиз в базу';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
